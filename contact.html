<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – LE CM CAFE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">LE CM CAFE</a>
    </div>
  </nav>

  <!-- FORMULAIRE DE CONTACT -->
  <section class="section" style="min-height: 100vh;">
    <div class="menu-wrapper">
      <h1 class="text-center mb-4" style="font-family: 'Playfair Display', serif; color: #ffe0b2;">Contactez-nous</h1>

      <form action="mailto:" method="POST" enctype="text/plain" style="max-width: 700px; margin: auto;">
        <div class="mb-3">
          <label for="name" class="form-label text-white">Votre nom</label>
          <input type="text" class="form-control" id="name" name="Nom" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label text-white">Votre e-mail</label>
          <input type="email" class="form-control" id="email" name="Email" required>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label text-white">Votre message</label>
          <textarea class="form-control" id="message" name="Message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-warning px-4 py-2 fw-bold">Envoyer</button>
        <a href="index.html#contact" class="btn btn-secondary ms-3">⬅ Retour</a>
      </form>
    </div>
  </section>

  <!-- BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
